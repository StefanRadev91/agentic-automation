name: Playwright Tests

# Runs the whole suite (UI + E2E + API) against the public EventHub practice
# app and publishes the HTML report to GitHub Pages.
# Nothing here is a secret: the URLs are public and every run registers its
# own throwaway EventHub account (see tests/app/auth-api.setup.ts).
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: playwright-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            APP_URL: https://eventhub.rahulshettyacademy.com
            API_URL: https://api.eventhub.rahulshettyacademy.com/api
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Write env file from workflow env
              run: |
                  mkdir -p env
                  {
                    echo "APP_URL=$APP_URL"
                    echo "API_URL=$API_URL"
                  } > env/.env.dev

            - name: Install Playwright browser
              run: npx playwright install --with-deps chromium

            - name: Run Playwright tests
              run: npx playwright test --project=chromium --project=api --reporter=html

            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14

            - uses: actions/upload-pages-artifact@v3
              if: always() && github.ref == 'refs/heads/main'
              with:
                  path: playwright-report/

    publish-report:
        needs: test
        if: always() && github.ref == 'refs/heads/main' && needs.test.result != 'skipped'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
